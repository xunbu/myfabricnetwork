<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>区块链浏览器</title>
    <script src="/static/js/vue.global.prod.js"></script>
    <script src="/static/js/vue-router.global.prod.js"></script>
    <script src="/static/js/chart.js"></script>

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --bg-sub: #f1f5f9;

            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-primary-light: #eff6ff;
            /* blue-50 */

            --color-accent: #9333ea;
            --color-accent-light: #faf5ff;
            /* purple-50 */

            --color-success: #059669;
            --color-success-bg: #ecfdf5;
            --color-danger: #dc2626;
            --color-danger-bg: #fef2f2;

            --text-main: #1e293b;
            --text-sub: #64748b;
            --text-placeholder: #94a3b8;

            --border-color: #e2e8f0;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);

            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* 通用布局工具类 */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .flex-col {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            flex-direction: row;
        }

        .flex-grow {
            flex-grow: 1;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .justify-center {
            justify-content: center;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        .text-right {
            text-align: right;
        }

        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .hidden {
            display: none;
        }

        /* ====================
           组件样式
           ==================== */

        /* 顶部导航 */
        .app-header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-content {
            height: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            cursor: pointer;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
        }

        .brand .subtitle {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .nav-menu {
            display: none;
            /* 移动端默认隐藏，大屏显示 */
            background-color: #f1f5f9;
            padding: 0.25rem;
            border-radius: var(--radius-lg);
            gap: 0.25rem;
        }

        @media (min-width: 768px) {
            .nav-menu {
                display: flex;
            }
        }

        .nav-link {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: var(--text-sub);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .nav-link.active {
            background-color: #fff;
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--color-success);
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--text-sub);
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            color: var(--color-primary);
            background-color: var(--color-primary-light);
        }

        /* 核心内容区 */
        .main-content {
            padding-top: 2rem;
            padding-bottom: 2rem;
            gap: 2rem;
        }

        /* 卡片面板 */
        .card-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-panel:hover {
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .card-padding {
            padding: 1.5rem;
        }

        /* 统计卡片 Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .stat-card {
            padding: 1.25rem;
            border-radius: var(--radius-xl);
            position: relative;
            background: #fff;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.1);
            color: var(--color-primary);
        }

        .stat-icon {
            position: absolute;
            right: 1rem;
            top: 1rem;
            padding: 0.5rem;
            background: #f8fafc;
            border-radius: var(--radius-lg);
            font-size: 1.5rem;
            color: #94a3b8;
            transition: all 0.3s;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            font-family: monospace;
        }

        /* 图表区域 Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .chart-container {
            height: 380px;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .title-mark {
            width: 4px;
            height: 1.25rem;
            border-radius: var(--radius-full);
        }

        .bg-mark-primary {
            background-color: var(--color-primary);
        }

        .bg-mark-accent {
            background-color: var(--color-accent);
        }

        .canvas-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        /* 区块链条展示 */
        .chain-view-container {
            border-top: 4px solid var(--color-primary);
            padding: 0;
        }

        .chain-header {
            background-color: #f8fafc;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            color: #334155;
            font-size: 0.875rem;
        }

        .chain-scroll-area {
            overflow-x: auto;
            padding: 2rem;
            background-color: rgba(248, 250, 252, 0.5);
            /* Mask Fade */
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }

        .chain-list {
            display: flex;
            align-items: center;
            gap: 2rem;
            min-width: max-content;
            padding-right: 1rem;
        }

        .chain-item {
            position: relative;
            cursor: pointer;
        }

        /* 连接线 */
        .chain-link::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -2rem;
            width: 2rem;
            height: 2px;
            background: #cbd5e1;
            z-index: 0;
        }

        .chain-item:last-of-type .chain-link::after {
            display: none;
        }

        /* 块卡片 */
        .block-card {
            width: 11rem;
            /* 44 * 0.25rem */
            height: 13rem;
            /* 52 * 0.25rem */
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            transition: all 0.3s;
            box-shadow: var(--shadow-sm);
        }

        .block-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--color-primary);
            transform: translateY(-4px);
        }

        /* 按钮样式 */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-hover);
        }

        .btn-ghost {
            background-color: #f1f5f9;
            color: #475569;
            border-color: var(--border-color);
        }

        .btn-ghost:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-text {
            background: none;
            color: var(--color-primary);
            padding: 0;
        }

        .btn-text:hover {
            text-decoration: underline;
        }

        .btn-text-danger {
            color: var(--color-danger);
        }

        /* 表格样式 */
        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        .data-table th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background-color: #f8fafc;
        }

        /* 标签 Badge */
        .badge {
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-blue {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        .badge-purple {
            background: var(--color-accent-light);
            color: var(--color-accent);
        }

        .badge-success {
            background: var(--color-success-bg);
            color: var(--color-success);
        }

        .badge-danger {
            background: var(--color-danger-bg);
            color: var(--color-danger);
        }

        /* 表单控件 */
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            color: var(--text-main);
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px var(--color-primary-light);
        }

        /* 模态框 Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            width: 100%;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            z-index: 110;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            background-color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
        }

        .modal-close {
            font-size: 1.5rem;
            color: #94a3b8;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #475569;
        }

        /* 特定细节样式 */
        .break-all {
            word-break: break-all;
        }

        .select-all {
            user-select: all;
        }

        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .detail-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .info-box {
            padding: 1rem;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-family: monospace;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .info-value-lg {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* 节点监控页 */
        .nodes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .nodes-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 1280px) {
            .nodes-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .node-card {
            border-top: 4px solid transparent;
        }

        .border-primary {
            border-color: var(--color-primary);
        }

        .border-accent {
            border-color: var(--color-accent);
        }
    </style>
</head>

<body>
    <div id="app" class="flex-col flex-grow" style="position: relative;">

        <!-- 顶部导航 -->
        <header class="app-header">
            <div class="container header-content">
                <div class="brand flex-row items-center gap-2" @click="$router.push('/')">
                    <div>
                        <h1>区块链浏览器</h1>
                        <div class="subtitle">企业级监控平台</div>
                    </div>
                </div>

                <nav class="nav-menu">
                    <router-link to="/" custom v-slot="{ navigate, isActive }">
                        <a href="#" @click="navigate" class="nav-link" :class="{ active: isActive }">首页概览</a>
                    </router-link>
                    <router-link to="/nodes" custom v-slot="{ navigate, isActive }">
                        <a href="#" @click="navigate" class="nav-link" :class="{ active: isActive }">节点监控</a>
                    </router-link>
                    <router-link to="/data" custom v-slot="{ navigate, isActive }">
                        <a href="#" @click="navigate" class="nav-link" :class="{ active: isActive }">链上数据</a>
                    </router-link>
                </nav>

                <div class="status-indicator">
                    <div class="text-right hidden" style="display: block;"> <!-- Always show on large, logic in CSS -->
                        <div style="font-size: 12px; font-family: monospace; color: #475569;">{{ refreshStatus }}</div>
                        <div
                            style="font-size: 10px; color: var(--color-success); font-weight: bold; display: flex; align-items: center; justify-content: flex-end;">
                            <span class="status-dot"></span> 运行中
                        </div>
                    </div>
                    <button @click="triggerGlobalRefresh" class="refresh-btn" title="刷新">↻</button>
                </div>
            </div>
        </header>

        <!-- 路由出口 -->
        <main class="container flex-col flex-grow main-content">
            <router-view v-slot="{ Component }">
                <keep-alive :include="['NodesPage']">
                    <component :is="Component" ref="viewComponent" />
                </keep-alive>
            </router-view>
        </main>
    </div>

    <!-- 1. 首页模版 -->
    <template id="tpl-home">
        <div class="flex-col gap-4">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div v-for="(item, key) in overviewItems" :key="key" class="stat-card">
                    <div class="stat-icon">{{ item.icon }}</div>
                    <div class="stat-label">{{ item.label }}</div>
                    <div class="stat-value">{{ formatNumber(overview[item.key]) }}</div>
                </div>
            </div>

            <!-- 图表 -->
            <div class="charts-grid">
                <div class="card-panel card-padding chart-container">
                    <h3 class="chart-title">
                        <span class="title-mark bg-mark-primary"></span> 交易趋势
                    </h3>
                    <div class="canvas-wrapper"><canvas id="txChart"></canvas></div>
                </div>
                <div class="card-panel card-padding chart-container">
                    <h3 class="chart-title">
                        <span class="title-mark bg-mark-accent"></span> 出块统计
                    </h3>
                    <div class="canvas-wrapper"><canvas id="blockChart"></canvas></div>
                </div>
            </div>

            <!-- 区块流 -->
            <div class="card-panel chain-view-container">
                <div class="chain-header flex-row items-center gap-2">
                    <span>⛓️ 实时区块流 (最新 50 块)</span>
                </div>
                <div class="chain-scroll-area">
                    <div class="chain-list">
                        <div v-for="block in trendBlocks" :key="block.blockNumber" class="chain-item"
                            @click="goToBlock(block.blockNumber)">
                            <div class="chain-link">
                                <div class="block-card">
                                    <div class="flex-row justify-between" style="align-items: flex-start;">
                                        <span class="font-mono"
                                            style="font-size: 1.5rem; font-weight: 700; color: #1e293b;">#{{
                                            block.blockNumber }}</span>
                                        <span class="badge badge-blue">{{ block.txCount }} 笔</span>
                                    </div>
                                    <div class="flex-col gap-2">
                                        <div>
                                            <div class="info-label">哈希 (Hash)</div>
                                            <div class="font-mono break-all"
                                                style="font-size: 10px; color: #475569; line-height: 1.2;">{{
                                                block.blockHash.substring(0, 16) }}...</div>
                                        </div>
                                    </div>
                                    <div class="flex-row justify-between font-mono"
                                        style="border-top: 1px solid #f1f5f9; padding-top: 0.75rem; font-size: 10px; color: #94a3b8;">
                                        <span>{{ formatTimestamp(block.timestamp).split(' ')[1] }}</span>
                                        <span>{{ formatBytes(block.blockSize) }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 省略号 -->
                        <div v-if="trendBlocks.length >= 50" class="chain-item"
                            style="opacity: 0.5; padding-left: 1rem;">
                            <div class="flex-col items-center justify-center gap-2">
                                <div
                                    style="font-size: 2.25rem; font-weight: 700; color: #cbd5e1; letter-spacing: 0.1em;">
                                    •••</div>
                                <div class="info-label">History</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 区块列表表格 -->
            <div class="card-panel card-padding">
                <div class="flex-row justify-between items-center" style="margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.125rem; font-weight: 700;">区块账本记录</h2>
                    <div class="flex-row items-center gap-2">
                        <button @click="prevPage" :disabled="blockPage === 0" class="btn btn-ghost">上一页</button>
                        <span class="font-mono"
                            style="color: var(--color-primary); font-weight: 700; font-size: 0.875rem;">第 {{ blockPage +
                            1 }} 页</span>
                        <button @click="nextPage" :disabled="(blockPage + 1) * pageSize >= overview.blockHeight"
                            class="btn btn-ghost">下一页</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>区块号</th>
                                <th>哈希值</th>
                                <th style="text-align: center;">交易数</th>
                                <th>生成时间</th>
                                <th style="text-align: right;">大小</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="block in blocks" :key="block.blockNumber" @click="goToBlock(block.blockNumber)"
                                style="cursor: pointer;">
                                <td class="font-mono" style="font-weight: 700; color: var(--color-primary);">#{{
                                    block.blockNumber }}</td>
                                <td class="font-mono" style="font-size: 0.75rem; color: var(--text-sub);">{{
                                    block.blockHash.substring(0, 32) }}...</td>

    <script>
        // Vue 和 路由逻辑保持完全不变
        const { createApp, ref, reactive, nextTick, onMounted, onUnmounted, watch } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // 工具函数
        const formatNumber = n => n ? n.toLocaleString() : 0;
        const formatTimestamp = t => t ? new Date(t).toLocaleString('zh-CN') : '-';
        const formatBytes = b => { if (!b) return '0 B'; const i = Math.floor(Math.log(b) / Math.log(1024)); return `${(b / Math.pow(1024, i)).toFixed(2)} ${['B', 'KB', 'MB'][i]}`; };
        const getUsageColor = v => v > 80 ? 'text-danger' : (v > 50 ? 'text-warning' : 'text-success'); // CSS class update required if using this, or inline style
        // 修改 getUsageColor 以适配内联样式或新的 class 逻辑
        // 在上方 template 中我使用了 :class 绑定，所以这里需要调整返回的 class 名或者 style
        // 为了方便，我将 class 名改为颜色类名，并在 style 中补充 .text-danger 等
        // .text-danger { color: #dc2626; } .text-warning { color: #eab308; } .text-success { color: #16a34a; }

        const truncateText = (t, l) => t && t.length > l ? t.substring(0, l) + '...' : t;
        const formatTxType = (type) => { const map = { 'ENDORSER_TRANSACTION': '背书交易', 'CONFIG': '配置交易', 'CONFIG_UPDATE': '配置更新', 'PEER_RESOURCE_UPDATE': '节点资源更新' }; return map[type] || type; };

        // 补充辅助 CSS 类
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            .text-danger { color: #dc2626; }
            .text-warning { color: #eab308; }
            .text-success { color: #16a34a; }
        `;
        document.head.appendChild(styleSheet);

        // 组件: 交易详情 Modal
        const TxModalComponent = {
            template: '#tpl-tx-modal', props: ['txId'], emits: ['close'],
            setup(props) {
                const txDetail = ref(null);
                const loading = ref(true);
                onMounted(async () => {
                    try { const r = await fetch(`/valuechain/transaction?txID=${props.txId}`); txDetail.value = await r.json(); }
                    catch (e) { console.error(e); } finally { loading.value = false; }
                });
                return { txDetail, loading, formatTimestamp, formatTxType, formatBytes };
            }
        };

        // 页面: 首页
        const HomePage = {
            template: '#tpl-home',
            setup() {
                const router = useRouter();
                const overview = reactive({});
                const blocks = ref([]);
                const trendBlocks = ref([]);
                const blockPage = ref(0);
                const pageSize = 10;
                let txChart = null, blockChart = null, timer = null;
                const overviewItems = { blockHeight: { label: '区块高度', key: 'blockHeight', icon: '⛓' }, totalTransactionCount: { label: '总交易量', key: 'totalTransactionCount', icon: '⚡' }, orgCount: { label: '组织数量', key: 'orgCount', icon: '🏢' }, chainCodeCount: { label: '智能合约', key: 'chainCodeCount', icon: '📜' }, nodeCount: { label: '活跃节点', key: 'nodeCount', icon: '🖥️' } };

                const refreshData = async () => {
                    try {
                        const [infoRes, blockRes, trendRes] = await Promise.all([
                            fetch('/valuechain/info'),
                            fetch(`/valuechain/blocks?pageNum=${blockPage.value}&pageSize=${pageSize}`),
                            fetch('/valuechain/trend')
                        ]);

                        if (infoRes.ok) Object.assign(overview, await infoRes.json());
                        if (blockRes.ok) blocks.value = (await blockRes.json()).blockPage || [];

                        if (trendRes.ok) {
                            const rawData = (await trendRes.json()).blockPage || [];
                            processCharts(rawData);
                            trendBlocks.value = rawData.slice(0, 50);
                        }
                    } catch (e) { console.error("Home refresh failed", e); }
                };

                const processCharts = (rawBlocks) => {
                    const ctxTx = document.getElementById('txChart');
                    const ctxBlk = document.getElementById('blockChart');
                    if (!ctxTx || !ctxBlk) return;

                    const buckets = {};
                    const labels = [];
                    const daysToShow = 14;

                    for (let i = daysToShow - 1; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        const label = `${d.getMonth() + 1}/${d.getDate()}`;
                        labels.push(label);
                        buckets[key] = { tx: 0, blk: 0 };
                    }

                    rawBlocks.forEach(b => {
                        const d = new Date(b.timestamp);
                        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        if (buckets[key]) {
                            buckets[key].blk++;
                            buckets[key].tx += b.txCount;
                        }
                    });

                    const opts = {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: false },
                        scales: {
                            x: { grid: { display: false } },
                            y: { grid: { color: '#e2e8f0', borderDash: [4, 4] }, beginAtZero: true }
                        }
                    };

                    if (txChart) txChart.destroy();
                    txChart = new Chart(ctxTx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                data: Object.values(buckets).map(v => v.tx),
                                borderColor: '#2563eb',
                                backgroundColor: '#2563eb20',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: opts
                    });

                    if (blockChart) blockChart.destroy();
                    blockChart = new Chart(ctxBlk, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                data: Object.values(buckets).map(v => v.blk),
                                backgroundColor: '#9333ea',
                                borderRadius: 3
                            }]
                        },
                        options: opts
                    });
                };

                const prevPage = () => { if (blockPage.value > 0) { blockPage.value--; refreshData(); } };
                const nextPage = () => { blockPage.value++; refreshData(); };
                const goToBlock = (num) => router.push('/block/' + num);
                const triggerRefresh = () => refreshData();

                onMounted(() => { refreshData(); timer = setInterval(refreshData, 10000); });
                onUnmounted(() => { clearInterval(timer); if (txChart) txChart.destroy(); if (blockChart) blockChart.destroy(); });
                return { overview, overviewItems, blocks, trendBlocks, blockPage, pageSize, formatNumber, formatTimestamp, formatBytes, prevPage, nextPage, goToBlock, triggerRefresh };
            }
        };

        // 页面: 节点监控
        const NodesPage = {
            template: '#tpl-nodes',
            name: 'NodesPage',
            setup() {
                const nodeTab = ref('cpu');
                const timeRange = ref('1');
                const refreshRate = ref('5');
                const cpuNodes = reactive({});
                const memoryNodes = reactive({});
                const charts = {};
                let timer = null;

                const calculateYAxisMax = (dataValues) => {
                    const maxVal = Math.max(...dataValues, 0);
                    let limit = Math.ceil((maxVal * 1.2) / 10) * 10;
                    if (limit < 10) limit = 10;
                    if (limit > 100) limit = 100;
                    return limit;
                };

                const refreshNodeData = async () => {
                    const currentTab = nodeTab.value;
                    const url = currentTab === 'cpu' ? '/valuechain/cpuHistory' : '/valuechain/memoryHistory';
                    try {
                        const res = await fetch(url);
                        if (!res.ok) return;
                        const data = await res.json();
                        const targetNodes = currentTab === 'cpu' ? cpuNodes : memoryNodes;
                        const cutoffTime = Date.now() - (parseInt(timeRange.value) * 60 * 1000);

                        Object.keys(data).forEach(name => {
                            const hist = data[name] || [];
                            const last = hist[hist.length - 1] || {};
                            targetNodes[name] = {
                                latestUsage: currentTab === 'cpu'
                                    ? (last.CPUUsage || 0)
                                    : ((last.TotalMemory > 0) ? (last.UsedMemory / last.TotalMemory * 100) : 0)
                            };
                        });

                        nextTick(() => {
                            Object.keys(data).forEach(name => {
                                const hist = data[name] || [];
                                const filtered = hist.filter(d => new Date(d.Timestamp).getTime() > cutoffTime);
                                const labels = filtered.map(d => new Date(d.Timestamp).toLocaleTimeString());
                                const values = filtered.map(d => currentTab === 'cpu'
                                    ? (d.CPUUsage || 0)
                                    : (d.TotalMemory > 0 ? (d.UsedMemory / d.TotalMemory * 100) : 0)
                                );

                                const ctxId = `${currentTab}-chart-${name}`;
                                const ctx = document.getElementById(ctxId);

                                if (!ctx) return;

                                const dynamicMax = calculateYAxisMax(values);

                                if (charts[ctxId]) {
                                    charts[ctxId].data.labels = labels;
                                    charts[ctxId].data.datasets[0].data = values;
                                    charts[ctxId].options.scales.y.max = dynamicMax;
                                    charts[ctxId].update('none');
                                } else {
                                    const color = currentTab === 'cpu' ? '#2563eb' : '#9333ea';
                                    charts[ctxId] = new Chart(ctx, {
                                        type: 'line',
                                        data: {
                                            labels: labels,
                                            datasets: [{
                                                data: values,
                                                borderColor: color,
                                                borderWidth: 2,
                                                pointRadius: 0,
                                                fill: false,
                                                tension: 0.2
                                            }]
                                        },
                                        options: {
                                            responsive: true,
                                            maintainAspectRatio: false,
                                            animation: false,
                                            plugins: { legend: { display: false } },
                                            scales: {
                                                x: { display: false },
                                                y: {
                                                    min: 0,
                                                    max: dynamicMax,
                                                    ticks: { count: 5 }
                                                }
                                            }
                                        }
                                    });
                                }
                            });
                        });
                    } catch (e) { console.error(e); }
                };

                const switchNodeTab = (t) => {
                    if (nodeTab.value === t) return;
                    Object.keys(charts).forEach(key => { if (charts[key]) { charts[key].destroy(); delete charts[key]; } });
                    nodeTab.value = t;
                    nextTick(() => { refreshNodeData(); });
                };

                const startNodeRefresh = () => {
                    clearInterval(timer);
                    if (refreshRate.value > 0) timer = setInterval(refreshNodeData, refreshRate.value * 1000);
                };

                const forceRefreshNode = () => { refreshNodeData(); };
                const triggerRefresh = () => refreshNodeData();

                onMounted(() => { refreshNodeData(); startNodeRefresh(); });
                onUnmounted(() => { clearInterval(timer); Object.values(charts).forEach(c => c.destroy()); });

                return { nodeTab, timeRange, refreshRate, cpuNodes, memoryNodes, switchNodeTab, forceRefreshNode, startNodeRefresh, getUsageColor, triggerRefresh };
            }
        };

        // 页面: 链上数据
        const DataPage = {
            template: '#tpl-data', components: { 'tx-modal': TxModalComponent },
            setup() {
                const chainData = ref([]); const filteredData = ref([]); const dataPageNum = ref(0); const dataPageSize = ref(10); const searchTerm = ref('');
                const showAddModal = ref(false); const showHistoryModal = ref(false); const showTxModal = ref(false); const currentTxId = ref('');
                const newKey = ref(''); const newValue = ref(''); const addSubmitting = ref(false); const historyKey = ref(''); const historyData = ref([]);

                const loadChainData = async () => {
                    try { const r = await fetch(`/valuechain/data/all?pageNum=${dataPageNum.value}&pageSize=${dataPageSize.value}`); if (r.ok) { chainData.value = (await r.json()).results || []; filterChainData(); } } catch (e) { console.error(e); }
                };
                const filterChainData = () => {
                    let d = chainData.value; if (searchTerm.value) d = d.filter(i => i.key.includes(searchTerm.value));
                    filteredData.value = d.map(i => ({ ...i, isJson: i.value && i.value.trim().startsWith('{'), formattedValue: i.value && i.value.trim().startsWith('{') ? tryFormatJson(i.value) : i.value, collapsed: true }));
                };
                const tryFormatJson = (str) => { try { return JSON.stringify(JSON.parse(str), null, 2); } catch (e) { return str; } };
                const toggleJsonDisplay = i => filteredData.value[i].collapsed = !filteredData.value[i].collapsed;
                const prevDataPage = () => { if (dataPageNum.value > 0) { dataPageNum.value--; loadChainData(); } };
                const nextDataPage = () => { if (chainData.value.length === dataPageSize.value) { dataPageNum.value++; loadChainData(); } };
                const showAddDataModal = () => { newKey.value = ''; newValue.value = ''; showAddModal.value = true; };
                const submitData = async () => { addSubmitting.value = true; try { await fetch('/valuechain/data', { method: 'POST', body: JSON.stringify({ key: newKey.value, value: newValue.value }) }); showAddModal.value = false; loadChainData(); } finally { addSubmitting.value = false; } };
                const deleteKey = async (k) => { if (confirm('确认删除?')) { await fetch('/valuechain/data/delete', { method: 'POST', body: JSON.stringify({ key: k }) }); loadChainData(); } };
                const showKeyHistory = async (k) => { historyKey.value = k; showHistoryModal.value = true; const r = await fetch(`/valuechain/data/history?key=${k}`); historyData.value = await r.json(); };
                const openTxFromHistory = (txId) => { currentTxId.value = txId; showTxModal.value = true; };
                const triggerRefresh = () => loadChainData();
                onMounted(loadChainData);
                return { chainData, filteredData, searchTerm, dataPageNum, dataPageSize, showAddModal, showHistoryModal, showTxModal, currentTxId, newKey, newValue, addSubmitting, historyKey, historyData, prevDataPage, nextDataPage, filterChainData, toggleJsonDisplay, truncateText, formatTimestamp, showAddDataModal, submitData, deleteKey, showKeyHistory, openTxFromHistory, triggerRefresh };
            }
        };

        // 页面: 区块详情
        const BlockDetailPage = {
            template: '#tpl-block-detail', components: { 'tx-modal': TxModalComponent },
            setup() {
                const route = useRoute(); const router = useRouter(); const loading = ref(true); const blockDetail = reactive({}); const blockTxList = ref([]); const blockTxPage = ref(0); const blockTxPageSize = ref(10); const blockTxTotal = ref(0); const showTxModal = ref(false); const currentTxId = ref('');
                const loadBlock = async (bn) => { loading.value = true; try { const r = await fetch(`/valuechain/block?blockNum=${bn}`); Object.assign(blockDetail, await r.json()); blockTxPage.value = 0; await loadTxs(bn); } catch (e) { console.error(e); } finally { loading.value = false; } };
                const loadTxs = async (bn) => { const r = await fetch(`/valuechain/block/transactions?blockNum=${bn}&pageNum=${blockTxPage.value}&pageSize=${blockTxPageSize.value}`); if (r.ok) { const d = await r.json(); blockTxList.value = d.txPage || []; blockTxTotal.value = d.total || 0; } };
                watch(() => route.params.blockId, (newId) => { if (newId) loadBlock(newId); }, { immediate: true });
                const prevBlockTxPage = () => { blockTxPage.value--; loadTxs(blockDetail.blockNumber); };
                const nextBlockTxPage = () => { blockTxPage.value++; loadTxs(blockDetail.blockNumber); };
                const goToBlock = (num) => router.push('/block/' + num);
                const showTxDetail = (id) => { currentTxId.value = id; showTxModal.value = true; };
                const triggerRefresh = () => loadBlock(route.params.blockId);
                return { loading, blockDetail, blockTxList, blockTxPage, blockTxPageSize, blockTxTotal, showTxModal, currentTxId, prevBlockTxPage, nextBlockTxPage, goToBlock, showTxDetail, formatNumber, formatTimestamp, formatBytes, formatTxType, triggerRefresh };
            }
        };

        const routes = [{ path: '/', component: HomePage }, { path: '/nodes', component: NodesPage }, { path: '/data', component: DataPage }, { path: '/block/:blockId', component: BlockDetailPage }];
        const router = createRouter({ history: createWebHashHistory(), routes });
        const App = { setup() { const refreshStatus = ref('--'); const viewComponent = ref(null); setInterval(() => { refreshStatus.value = new Date().toLocaleTimeString('zh-CN'); }, 1000); const triggerGlobalRefresh = () => { if (viewComponent.value && viewComponent.value.triggerRefresh) { viewComponent.value.triggerRefresh(); } }; return { refreshStatus, viewComponent, triggerGlobalRefresh }; } };
        const app = createApp(App); app.use(router); app.mount('#app');
    </script>
</body>

</html>
